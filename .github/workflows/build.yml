name: Build Oryn Sideloadable IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios

      - name: Build unsigned archive
        working-directory: ios
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.parse(d).workspace.schemes.find(s=>!/Pods|Tests/.test(s)));});")
          echo "Workspace: $WORKSPACE"
          echo "Scheme:    $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Oryn.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            | tee ../xcodebuild.log | xcpretty || (echo "xcpretty not available, showing raw log tail:" && tail -n 300 ../xcodebuild.log)

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          cd ios/build/Oryn.xcarchive/Products/Applications
          APP_DIR=$(ls -d *.app | head -n1)
          echo "App bundle: $APP_DIR"
          mkdir Payload
          cp -r "$APP_DIR" Payload/
          zip -r -y "$GITHUB_WORKSPACE/oryn-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh oryn-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oryn-unsigned-ipa
          path: oryn-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

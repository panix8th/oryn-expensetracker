name: Build Oryn Sideloadable IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios

      - name: Build unsigned app (device)
        working-directory: ios
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{console.log(JSON.parse(d).workspace.schemes.find(s=>!/Pods|Tests/.test(s)));});")
          echo "Workspace: $WORKSPACE"
          echo "Scheme:    $SCHEME"

          # Use the "build" action, not "archive": with code signing disabled,
          # `xcodebuild archive` treats the app target as un-archivable and
          # silently skips compiling/linking it (it still reports "Archive
          # Succeeded" after only building library dependencies), leaving no
          # Products/Applications/*.app behind. `build` has no such gate.
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee ../xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find ios/build/Build/Products -mindepth 2 -maxdepth 2 -iname "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found under ios/build/Build/Products:" >&2
            find ios/build/Build/Products -maxdepth 2 >&2 || true
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y oryn-unsigned.ipa Payload
          ls -lh oryn-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: oryn-unsigned-ipa
          path: oryn-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
